# Publishes the app to GitHub Pages.
#
# Two things about this workflow matter more than the rest:
#
# 1. Only `dist/` is uploaded, and `scripts/check-build.mjs` proves the build output
#    contains nothing else before it is published. The shop's state document and the
#    MYOB exports live in the private `Production-App-Data` repository, out of reach
#    of this workflow — but the artifact is the one thing this repository puts on the
#    public internet, so the rule is enforced by a failing build, not by a comment.
#
# 2. The build is gated on the tests. A red main does not reach the shop floor.
#
# Pages has to be switched on once, in the repository's Settings → Pages, with
# Source set to "GitHub Actions". Everything below happens by itself after that.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # Pages serves a project site from /<repo>/, so asset URLs have to be
      # built with that prefix — a page built with base "/" loads and stays
      # blank. Taken from the repository name so a rename does not need a commit.
      - name: Work out the site base
        run: echo "BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_BASE: ${{ env.BASE }}
        run: pnpm run build

      - name: Check the build before publishing it
        # Resolves every reference the page and the manifest actually make, rather
        # than grepping for a few strings. A manifest that returns 200 and lists an
        # icon the build never shipped is invisible in a browser tab and enough to
        # stop a phone offering the install — which is how this was written, after
        # the manifest went out with only an SVG and a 180px iOS icon in it.
        run: node scripts/check-build.mjs "$BASE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
